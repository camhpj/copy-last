[package]
name = "cl"
version = "0.1.0"
edition = "2021"
description = "Copy your last N terminal commands and their output"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
strip-ansi-escapes = "0.2"

[profile.release]
lto = true
strip = true
